name: Mortal Ledger CI

# The fork's own verification. The inherited Bitcoin test suite asserts vanilla-Bitcoin
# behavior that this fork deliberately changes (MORT magic, BAB issuance, revived/sealed
# opcodes, Proof of Quotation), so it cannot pass unmodified. Instead we prove the fork's
# consensus directly: build the node, compile the real-Core link tests, and run the
# regtest demos. See test/mortal-ledger/.

on:
  push:
    branches: [mortal-ledger]
  pull_request:
    branches: [mortal-ledger]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: build + link tests + regtest demos
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkgconf python3 \
            libboost-dev libevent-dev libsqlite3-dev

      - name: Configure
        run: >
          cmake -B build
          -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF -DBUILD_GUI=OFF
          -DWITH_ZMQ=OFF -DBUILD_WALLET_TOOL=OFF -DENABLE_IPC=OFF

      - name: Build bitcoind + bitcoin-cli
        run: cmake --build build --target bitcoind bitcoin-cli -j"$(nproc)"

      - name: Mortal Ledger checks (link tests + regtest demos)
        run: bash test/mortal-ledger/run-checks.sh
